<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VG/LAB Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><div class="section-head"><div><p class="eyebrow">PRIVATE / ADMIN</p><h1>Message inbox</h1></div></div><div class="contact-form" style="max-width:760px"><div id="login"><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="btn primary" id="loginBtn">Login</button><p class="form-note">Credentials are read from server environment variables, never shipped to the client.</p></div><div id="inbox" hidden><div id="messages"></div><button class="btn secondary" id="logoutBtn">Logout</button></div></div></main><script>const $=s=>document.querySelector(s);async function load(){const r=await fetch('/api/admin/messages');if(r.ok){$('#login').hidden=true;$('#inbox').hidden=false;const data=await r.json();$('#messages').innerHTML=data.length?data.map(m=>`<article style="padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px"><b>${m.name}</b><div>${m.email}</div><small>${new Date(m.timestamp).toLocaleString()}</small><p>${m.message}</p><button class="btn secondary" onclick="del('${m.id}')">Delete</button></article>`).join(''):'<p>No messages yet.</p>';}}async function del(id){await fetch('/api/admin/messages/'+id,{method:'DELETE'});load()}$('#loginBtn').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});if(r.ok)load();else alert('Login failed')};$('#logoutBtn').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()};load();</script></body></html>
